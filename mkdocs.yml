markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/groups/BenLevi
      name: BLV Facebook group
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/c/BenLevi0
      name: YouTube
    - icon: fontawesome/solid/heart
      link: https://www.paypal.com/paypalme/BenBLV
      name: Donate

not_in_nav: |
  /mgn-cube/updates/*.md
  /ender-3-pro/updates/*.md
  /mgn12/updates/*.md
  /news/*.md

nav:
  - Home: index.md
  - BLV mgn Cube:
      - mgn-cube/index.md
      - Start here: mgn-cube/start.md
      - BOM: mgn-cube/bom.md
      - Download & Print: mgn-cube/download-and-print.md
      - Assembly: mgn-cube/assembly.md
      - Wiring: mgn-cube/wiring.md
      - Calibrations: mgn-cube/calibrations.md
      - Community remixes: mgn-cube/community.md
      - Project updates: mgn-cube/updates/index.md
      - License & Thanks: mgn-cube/license.md
  - BLV Ender 3 Pro:
      - ender-3-pro/index.md
      - BOM: ender-3-pro/bom.md
      - Build guide: ender-3-pro/build.md
      - Tips & extras: ender-3-pro/extras.md
      - Project updates: ender-3-pro/updates/index.md
      - License & Thanks: ender-3-pro/license.md
  - BLV mgn12 mod:
      - mgn12/index.md
      - BOM: mgn12/bom.md
      - Print & assemble: mgn12/build.md
      - Project updates: mgn12/updates/index.md
      - License & Thanks: mgn12/license.md
  - About:
      - About me: about.md
      - Community news: news/index.md
